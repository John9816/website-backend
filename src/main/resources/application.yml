server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain,text/event-stream,application/xml,text/xml
    min-response-size: 512
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:50}
    accept-count: ${TOMCAT_ACCEPT_COUNT:300}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    connection-timeout: 20000
    max-http-header-size: 8192
    max-swallow-size: 2097152
  shutdown: graceful

spring:
  application:
    name: website

  task:
    scheduling:
      pool:
        size: 2

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/website?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&cacheResultSetMetadata=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      pool-name: WebsiteHikariCP
      auto-commit: true
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 200
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

app:
  membership:
    free-lifetime-enabled: ${APP_MEMBERSHIP_FREE_LIFETIME_ENABLED:true}
  storage:
    image-upload-url: ${IMAGE_UPLOAD_URL:https://api.xunhuisi.store/API/Tuchuang/Tc.php}
    shared-dir: ${WEBSITE_SHARED_DIR:}
    image-dir: ${IMAGE_UPLOAD_DIR:uploads/images}
    avatar-dir: ${AVATAR_UPLOAD_DIR:uploads/avatars}
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtdG8tYS1zdHJvbmctc2VjcmV0LWtleS1hdC1sZWFzdC0zMi1ieXRlcw==}
    # Access token: short-lived; clients renew with /api/auth/refresh
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
    # Refresh token: long-lived opaque token stored hashed in DB
    refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:30}
    cleanup-retention-days: ${JWT_REFRESH_CLEANUP_RETENTION_DAYS:7}
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://*.vercel.app
      - https://api.751152.xyz
      - https://hi.751152.xyz
      - https://mt.751152.xyz
  admin:
    default-username: ${APP_ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${APP_ADMIN_DEFAULT_PASSWORD:admin123}
  update:
    storage-dir: ${APP_UPDATE_STORAGE_DIR:/opt/website/updates}
    base-url: ${APP_UPDATE_BASE_URL:https://api.751152.xyz/updates}
  music:
    qishui:
      encryption-key: ${QISHUI_ENCRYPTION_KEY:}
      client-key: ${QISHUI_CLIENT_KEY:}
      app-identity: ${QISHUI_APP_IDENTITY:}
      app-signature: ${QISHUI_APP_SIGNATURE:}
      # Optional override. When empty, the v1 access token is obtained automatically from the
      # account/password already stored in sys_config (music.tunefree.*).
      parse-access-token: ${QISHUI_PARSE_ACCESS_TOKEN:}
      # Optional public origin for the signed audio-stream URL handed to <audio>.
      # Empty (default) -> a same-origin relative path; the browser resolves it against the
      # page origin, avoiding any cross-subdomain dependency for media playback.
      # Set QISHUI_PUBLIC_BASE_URL only when the frontend and API live on different origins.
      public-base-url: ${QISHUI_PUBLIC_BASE_URL:}
      # On-disk cache for decrypted audio. The API runs with -Xmx768m, so the in-memory
      # Caffeine cache stays at 64 MB; lossless tracks (~33 MB each) are persisted here instead.
      # Entries are bounded (1 GiB) and expire with the audio ticket.
      cache-dir: ${QISHUI_CACHE_DIR:/opt/website/cache/qishui-audio}
      # Personal access code expires after 6 h upstream. Renew it automatically so the
      # "刷新授权" button is only a manual fallback. Refresh rotates bindingId and would
      # invalidate an in-flight roaming session, so users with a live session are skipped.
      auth-refresh-enabled: ${QISHUI_AUTH_REFRESH_ENABLED:true}
      auth-refresh-threshold-sec: ${QISHUI_AUTH_REFRESH_THRESHOLD_SEC:1800}
      auth-refresh-interval-ms: ${QISHUI_AUTH_REFRESH_INTERVAL_MS:300000}
      auth-refresh-initial-delay-ms: ${QISHUI_AUTH_REFRESH_INITIAL_DELAY_MS:60000}
    chksz:
      enabled: ${CHKSZ_ENABLED:true}
      base-url: ${CHKSZ_BASE_URL:https://api.chksz.com}
      api-key: ${CHKSZ_API_KEY:}
  playlist:
    # 自动同步配置
    auto-sync:
      # 是否启用自动同步（获取歌单详情时）
      enabled: ${PLAYLIST_AUTO_SYNC_ENABLED:true}
      # 同步间隔（小时），距离上次更新超过此时间才会重新同步
      interval-hours: ${PLAYLIST_AUTO_SYNC_INTERVAL_HOURS:6}
  book-sources:
    pinshuzhai-base-url: ${BOOK_SOURCE_PINSHUZHAI_BASE_URL:https://www.pinshuzhai.com}
    yckceo-book-catalog: ${BOOK_SOURCE_YCKCEO_BOOK_CATALOG:https://www.yckceo.com/yuedu/shuyuan/index.html}
    yckceo-rss-catalog: ${BOOK_SOURCE_YCKCEO_RSS_CATALOG:https://www.yckceo.com/yuedu/rss/index.html}
    legacy-book-catalog: ${BOOK_SOURCE_LEGACY_CATALOG:https://www.lifves.com/Home/book/booksourcelist.html}
    legacy-book-source-list: ${BOOK_SOURCE_LEGACY_LIST:https://www.lifves.com/api/v2/booksource/list}
  video-sources:
    ncat21-base-url: ${APP_VIDEO_NCAT21_BASE_URL:https://www.ncat21.com}
    cache-minutes: ${APP_VIDEO_CACHE_MINUTES:5}
    provider-config-cache-minutes: ${APP_VIDEO_PROVIDER_CONFIG_CACHE_MINUTES:30}
    provider-config-max-bytes: ${APP_VIDEO_PROVIDER_CONFIG_MAX_BYTES:524288}
    default-source-id: ${APP_VIDEO_DEFAULT_SOURCE_ID:ngzmods::剧和短剧}
    warehouses:
      - id: ngzmods
        name: NGZMods
        config-url: ${APP_VIDEO_NGZMODS_CONFIG_URL:https://16409.kstore.vip/tv/ngzmods.json}
        kind: TVBOX_JSON
        enabled: ${APP_VIDEO_NGZMODS_ENABLED:true}
        allow-http: ${APP_VIDEO_NGZMODS_ALLOW_HTTP:false}
        sort-order: ${APP_VIDEO_NGZMODS_SORT_ORDER:10}
        default-site-key: ${APP_VIDEO_NGZMODS_DEFAULT_SITE_KEY:剧和短剧}
      - id: newwex
        name: NewWex
        config-url: ${APP_VIDEO_NEWWEX_CONFIG_URL:https://9280.kstore.vip/newwex.json}
        kind: TVBOX_JSON
        enabled: ${APP_VIDEO_NEWWEX_ENABLED:true}
        allow-http: ${APP_VIDEO_NEWWEX_ALLOW_HTTP:false}
        sort-order: ${APP_VIDEO_NEWWEX_SORT_ORDER:20}
        default-site-key: ${APP_VIDEO_NEWWEX_DEFAULT_SITE_KEY:NewDouBan}
      - id: ncat21
        name: ncat21
        config-url: ${APP_VIDEO_NCAT21_BASE_URL:https://www.ncat21.com}
        kind: NCAT21_HTML
        enabled: ${APP_VIDEO_NCAT21_ENABLED:false}
        allow-http: ${APP_VIDEO_NCAT21_ALLOW_HTTP:false}
        sort-order: ${APP_VIDEO_NCAT21_SORT_ORDER:100}
        default-site-key: ${APP_VIDEO_NCAT21_DEFAULT_SITE_KEY:ncat21}
  registration:
    email-verification:
      required: ${APP_EMAIL_VERIFICATION_REQUIRED:true}
      expire-minutes: ${APP_EMAIL_CODE_EXPIRE_MINUTES:10}
      resend-interval-seconds: ${APP_EMAIL_CODE_RESEND_INTERVAL_SECONDS:60}
      max-attempts: ${APP_EMAIL_CODE_MAX_ATTEMPTS:5}
      ip-max-sends: ${APP_EMAIL_CODE_IP_MAX_SENDS:10}
      ip-window-minutes: ${APP_EMAIL_CODE_IP_WINDOW_MINUTES:60}
      global-max-sends-per-minute: ${APP_EMAIL_CODE_GLOBAL_MAX_PER_MINUTE:60}
      cleanup-retention-hours: ${APP_EMAIL_CODE_CLEANUP_RETENTION_HOURS:24}
      hmac-secret: ${APP_EMAIL_CODE_HMAC_SECRET:${JWT_SECRET:Y2hhbmdlLXRoaXMtdG8tYS1zdHJvbmctc2VjcmV0LWtleS1hdC1sZWFzdC0zMi1ieXRlcw==}}
      cloud-mail:
        base-url: ${CLOUD_MAIL_BASE_URL:https://mail.751152.xyz}
        username: ${CLOUD_MAIL_USERNAME:admin@751152.xyz}
        password: ${CLOUD_MAIL_PASSWORD:}
        from: ${CLOUD_MAIL_FROM:admin@751152.xyz}

logging:
  level:
    root: INFO
    com.example.website: INFO
    com.zaxxer.hikari: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      simple:
        enabled: true
    tags:
      application: ${spring.application.name}
