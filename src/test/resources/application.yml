spring:
  datasource:
    url: jdbc:h2:mem:website;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  storage:
    remote-avatar-enabled: false
    remote-kb-enabled: false
  music:
    chksz:
      enabled: false
      api-key:
  video-sources:
    ncat21-base-url: https://www.ncat21.com
    cache-minutes: 1
  jwt:
    secret: Y2hhbmdlLXRoaXMtdG8tYS1zdHJvbmctc2VjcmV0LWtleS1hdC1sZWFzdC0zMi1ieXRlcw==
    expire-minutes: 120
    refresh-expire-days: 30
    header: Authorization
    prefix: "Bearer "
  admin:
    default-username: admin
    default-password: admin123
  registration:
    email-verification:
      required: false

logging:
  level:
    root: WARN
    com.example.website: INFO
